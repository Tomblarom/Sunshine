---
# Fork-only custom AppImage build (x86_64, stable-based ramfallback test build).
#
# INSTALL: commit this file AS `.github/workflows/ci.yml` ONLY on the fork
# branch `build/2026.914.233613-ramfallback`. Do NOT merge it into any
# upstream-bound branch or PR. The fork default contains a dispatch bootstrap.
#
# DISPATCH (from a checkout of the fork):
#   gh workflow run ci.yml --ref build/2026.914.233613-ramfallback \
#     -f source_commit=<full 40-hex SHA>
# Omit `source_commit` to build the branch HEAD instead. The input is
# validated as 40-hex and the checkout is verified to match it exactly.
#
# WHAT IT DOES: checks out the given source commit (stable tag plus the
# backported ramfallback/libva changes), builds with the checked-out tree's
# own `scripts/linux_build.sh --appimage-build --skip-cuda`, packages an
# x86_64 AppImage on ubuntu-22.04 with the official linuxdeploy steps, runs
# the unit tests, and uploads the AppImage with SHA256, build-info, and
# SLSA-style build provenance attestation.
#
# WHAT IT DOES NOT DO: no release creation, no push, no publish of any kind.
# Artifacts are workflow run artifacts only.
#
# LIBVA POLICY (matches current master, NOT the original stable CI): the
# build links the distro system libva (headers + shared core/backends from
# the same libva-dev) and the AppImage bundles NO libva — core, backends,
# and driver configuration all come from the host at runtime. The workflow
# fails the build if sunshine is not dynamically linked against libva.so.2
# and libva-drm.so.2, or if any libva shared library or static archive is
# found inside the AppDir.
name: Custom AppImage (stable ramfallback)
permissions: {}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Full 40-hex source commit SHA to build (default: branch HEAD)'
        required: false
        default: ''
        type: string
      base_tag:
        description: 'Stable base tag used in the version string'
        required: false
        default: 'v2026.914.233613'
        type: string

env:
  PYTHON_VERSION: '3.14'

jobs:
  build_custom_appimage:
    name: Custom-AppImage-x86_64
    env:
      APP_ID: dev.lizardbyte.app.Sunshine
      M_ARCH: x86_64
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve and validate source commit
        id: source
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          HEAD_COMMIT: ${{ github.sha }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_COMMIT:-$HEAD_COMMIT}"
          if ! [[ "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a full 40-hex SHA, got: ${requested}"
            exit 1
          fi
          if ! [[ "$BASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::base_tag must look like vYYYY.MDD.PATCH, got: ${BASE_TAG}"
            exit 1
          fi
          short="${requested:0:12}"
          version="${BASE_TAG#v}-ramfallback-${short}"
          {
            echo "SOURCE_COMMIT=${requested}"
            echo "SHORT_SHA=${short}"
            echo "VERSION=${version}"
          } >> "$GITHUB_ENV"
          echo "commit=${requested}" >> "$GITHUB_OUTPUT"
          echo "Building ${version} from ${requested}"

      - name: More space
        uses: LizardByte/actions/actions/more_space@28374bf43cc8b6ee88b9b8a3419b2ac7a6573906  # v2026.928.123224
        with:
          analyze-space-savings: true
          clean-all: true

      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Checkout AppImage build dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # FFmpeg and codec libraries are prebuilt release dependencies. Their
          # source trees are not AppImage inputs. Flatpak tooling is needed only
          # because the pinned Python tool environment declares a local package.
          git submodule update --init --depth 1 --jobs 4 \
            third-party/build-deps third-party/Simple-Web-Server \
            third-party/TPCircularBuffer third-party/glad \
            third-party/libdisplaydevice third-party/libvirtualhid \
            third-party/lizardbyte-common third-party/moonlight-common-c \
            third-party/plasma-wayland-protocols third-party/tray \
            third-party/wayland-protocols third-party/wlr-protocols \
            packaging/linux/flatpak/deps/flatpak-builder-tools
          git -C third-party/build-deps submodule update --init --depth 1 \
            third-party/FFmpeg/Vulkan-Headers
          for module in libdisplaydevice libvirtualhid lizardbyte-common moonlight-common-c tray; do
            git -C "third-party/$module" submodule update --init --recursive --depth 1 --jobs 4
          done

      - name: Verify checkout matches source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          git merge-base --is-ancestor "${{ inputs.base_tag }}" HEAD
          git merge-base --is-ancestor v2026.914.233613 HEAD
          git submodule status
          git log --oneline -3

      - name: Setup Dependencies Linux
        timeout-minutes: 10
        run: |
          # create the artifacts directory
          mkdir -p artifacts

          # allow libfuse2 for appimage on 22.04+
          sudo add-apt-repository universe

          sudo apt-get install -y \
            libdrm-dev \
            libfuse2 \
            libgl-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-dri3-dev \
            libxfixes-dev \
            libxtst-dev

      - name: Install system libva (distro)
        # The checked-out stable linux_build.sh skips libva-dev for AppImage
        # builds; install the distro package explicitly so the build links the
        # host-matched system libva (headers + shared core/backends) instead
        # of building/bundling a private libva.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libva-dev
          echo "libva pkg-config versions:"
          pkg-config --modversion libva libva-drm
          echo "installed libva packages:"
          dpkg-query -W 'libva*' | sort

      - name: Build Linux
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_VERSION: ${{ env.VERSION }}
          COMMIT: ${{ env.SOURCE_COMMIT }}
        run: |
          chmod +x ./scripts/linux_build.sh
          echo "::add-matcher::.github/matchers/gcc.json"
          ./scripts/linux_build.sh \
            --publisher-name="${GITHUB_REPOSITORY_OWNER}" \
            --publisher-website="https://app.lizardbyte.dev" \
            --publisher-issue-url="https://github.com/${GITHUB_REPOSITORY}/issues" \
            --skip-cleanup \
            --num-processors=2 \
            --skip-cuda \
            --skip-package \
            --ubuntu-test-repo \
            --appimage-build
          echo "::remove-matcher owner=gcc::"

      - name: Package Linux - AppImage
        working-directory: cmake-build-appimage
        run: |
          # install sunshine to the DESTDIR
          DESTDIR=AppDir ninja install
          test -f AppDir/usr/share/sunshine/udev/rules.d/60-sunshine.rules
          grep -Fq 'IMPORT{parent}="HID_*"' \
            AppDir/usr/share/sunshine/udev/rules.d/60-sunshine.rules
          grep -Fq 'ENV{HID_PHYS}=="libvirtualhid/uhid/*"' \
            AppDir/usr/share/sunshine/udev/rules.d/60-sunshine.rules

          # custom AppRun file
          cp -f ../packaging/linux/AppImage/AppRun ./AppDir/
          chmod +x ./AppDir/AppRun

          # variables
          DESKTOP_FILE="${DESKTOP_FILE:-${APP_ID}.desktop}"
          ICON_FILE="${ICON_FILE:-sunshine.png}"
          LINUXDEPLOY_GH="https://github.com/linuxdeploy/linuxdeploy"

          # AppImage
          # https://docs.appimage.org/packaging-guide/index.html
          url="${LINUXDEPLOY_GH}/releases/download/continuous/linuxdeploy-${M_ARCH}.AppImage"
          wget --max-redirect=1 -q "$url"  # NOSONAR(githubactions:S6506): GitHub release needs one redirect.
          chmod +x "linuxdeploy-${M_ARCH}.AppImage"

          # https://github.com/linuxdeploy/linuxdeploy-plugin-qt
          url="${LINUXDEPLOY_GH}-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${M_ARCH}.AppImage"
          wget --max-redirect=1 -q "$url"  # NOSONAR(githubactions:S6506): GitHub release needs one redirect.
          chmod +x "linuxdeploy-plugin-qt-${M_ARCH}.AppImage"
          export QMAKE=/usr/lib/qt6/bin/qmake
          export EXTRA_QT_MODULES="svg;"
          "$QMAKE" -query QT_INSTALL_PLUGINS

          "./linuxdeploy-${M_ARCH}.AppImage" \
            --appdir ./AppDir \
            --plugin qt \
            --executable ./sunshine \
            --exclude-library 'libva.so*' \
            --exclude-library 'libva-*.so*' \
            --icon-file "../$ICON_FILE" \
            --desktop-file "./$DESKTOP_FILE" \
            --output appimage

          # Host-libva consistency: sunshine must link the host's libva core
          # and DRM backend dynamically, and the AppDir must bundle no libva
          # shared library or static archive at all.
          readelf -d ./sunshine | grep -F 'Shared library: [libva.so.2]'
          readelf -d ./sunshine | grep -F 'Shared library: [libva-drm.so.2]'
          test -z "$(find ./AppDir \( -name 'libva.so*' -o -name 'libva-*.so*' \) -print -quit)"
          test -z "$(find ./AppDir -name 'libva*.a' -print -quit)"
          echo "--- sunshine NEEDED entries (informational) ---"
          readelf -d ./sunshine | grep -E 'NEEDED|Shared library' || true

          # print original name of AppImage file
          echo "AppImage file: $(ls Sunshine*.AppImage)"

          # move
          mv Sunshine*.AppImage "../artifacts/Sunshine_${VERSION}_${M_ARCH}.AppImage"

          # permissions
          chmod +x "../artifacts/Sunshine_${VERSION}_${M_ARCH}.AppImage"

      - name: Write build info and SHA256
        run: |
          set -euo pipefail
          appimage="artifacts/Sunshine_${VERSION}_${M_ARCH}.AppImage"
          test -f "$appimage"
          {
            echo "version=${VERSION}"
            echo "base_tag=${{ inputs.base_tag }}"
            echo "source_commit=${SOURCE_COMMIT}"
            echo "base_commit=$(git rev-parse "${{ inputs.base_tag }}^{}")"
            echo "short_sha=${SHORT_SHA}"
            echo "branch=${{ github.ref_name }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "runner=ubuntu-22.04 (x86_64)"
            echo "cuda=OFF (skipped)"
            echo "libva_pkgconfig=$(pkg-config --modversion libva libva-drm | tr '\n' ' ')"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/build-info.txt
          cp custom-appimage/* artifacts/
          (cd artifacts && sha256sum "$(basename "$appimage")" > SHA256SUMS)
          cat artifacts/SHA256SUMS
          cat artifacts/build-info.txt
          git log --format=fuller "${{ inputs.base_tag }}..HEAD" > artifacts/source-commits.txt
          git submodule status --recursive > artifacts/submodules.txt
          sha256sum cmake-build-appimage/linuxdeploy*.AppImage > artifacts/packaging-tools.sha256
          cmake --version > artifacts/cmake-version.txt
          gcc-14 --version > artifacts/compiler-version.txt
          readelf -d cmake-build-appimage/sunshine > artifacts/elf-dependencies.txt

      - name: Setup python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify AppImage
        run: |
          # TODO: switch to upstream after
          # https://github.com/TheAssassin/appimagelint/pull/50 and
          # https://github.com/TheAssassin/appimagelint/pull/51
          APPIMAGELINT_REPOSITORY="git+https://github.com/ReenigneArcher/appimagelint.git"
          APPIMAGELINT_REF="lizardbyte"
          python -m pip install -e "${APPIMAGELINT_REPOSITORY}@${APPIMAGELINT_REF}#egg=appimagelint"
          appimagelint --help

          appimagelint "./artifacts/Sunshine_${VERSION}_${M_ARCH}.AppImage"

      - name: Install screenshot dependency
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

          # clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup virtual desktop
        uses: LizardByte/actions/actions/virtual_desktop@28374bf43cc8b6ee88b9b8a3419b2ac7a6573906  # v2026.928.123224

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Sync Python tools
        run: |
          uv_sync_args=(
            --locked
            --python "${PYTHON_VERSION}"
            --no-python-downloads
            --no-install-project
          )
          # uv.lock pins external artifacts; reviewed local build hooks are required for gcovr.
          uv sync "${uv_sync_args[@]}"  # NOSONAR(githubactions:S8541)

      - name: Run tests
        id: test
        working-directory: cmake-build-appimage/tests
        run: ./test_sunshine --gtest_color=yes --gtest_output=xml:test_results.xml

      - name: Upload system tray screenshots
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sunshine-screenshots-custom-AppImage-x86_64
          path: cmake-build-appimage/tests/screenshots
          if-no-files-found: error

      - name: Upload test results
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-custom-AppImage-x86_64
          path: cmake-build-appimage/tests/test_results.xml
          if-no-files-found: error

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-custom-AppImage-x86_64
          path: artifacts/
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: 'artifacts/*'
